name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Everything, not --omit=dev: the libraries bundled into the app (pdf.js, KaTeX, the Markdown and OCR
      # code) and Electron itself are devDependencies here, so leaving them out audits almost nothing that ships.
      - run: npm audit --audit-level=high
      - run: npm run test:chat-math
      - run: npm run test:thumbnails
      - run: node --test scripts/test-word-files.cjs scripts/test-network-security.cjs scripts/test-release-build.mjs scripts/test-claude-path.cjs scripts/test-digital-signature.cjs
      - run: node --test scripts/test-link-history.mjs
      - run: node --test scripts/test-openrouter.cjs
      - run: npm run build
      - name: Browser Edition link shortcuts
        run: |
          npx --no-install playwright-core install chromium --only-shell
          node scripts/test-browser-link-shortcuts.mjs
      - name: Reader security regressions
        env:
          FOLIO_TEST_CLIENT_IDENTITY: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: npm run test:reader-security
      - name: Smoke test
        run: npm run smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: release/smoke/
          if-no-files-found: ignore
