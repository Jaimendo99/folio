# Builds the Windows and macOS installers when a version tag is pushed (scripts/release.mjs does that),
# checks that each packaged app starts, and hands the files to the release script as artifacts.
# Nothing is published from here: the maintainer's release script downloads these and creates the release on this
# same repository with the maintainer's own gh login, so this workflow only needs read access.
# This fork doesn't build Linux packages.
#
# Signing is automatic once its secrets exist (see SIGNING.md):
#   macOS:   MAC_CERTIFICATE_P12_BASE64, MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#            AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER
# Without them (the default for this fork), macOS builds are ad-hoc signed and only announce updates, and Windows
# builds are unsigned.
name: Release build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        shell: bash
        run: |
          set -eu
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(node --print 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

  windows:
    needs: verify
    environment: release-windows
    runs-on: windows-latest
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - &install
        run: npm ci
      - &build
        run: npm run build
      - name: Package Windows
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
        run: |
          extra=()
          if [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Signing with Azure Trusted Signing"
            extra+=(-c.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
              -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
              -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGNING_PROFILE"
              -c.win.azureSignOptions.publisherName="$AZURE_SIGNING_PUBLISHER")
          fi
          npx electron-builder --win nsis portable "${extra[@]}" --publish never
      - name: Old Folio cannot reopen during a Windows update
        shell: pwsh
        run: |
          $nsis = node -e "require('app-builder-lib/out/toolsets/windows').getMakeNsisPath().then(x => console.log(JSON.stringify(x)))" | ConvertFrom-Json
          $env:NSISDIR = $nsis.env.NSISDIR
          $fixture = Join-Path $env:RUNNER_TEMP "test-windows-update.exe"
          & $nsis.path /V2 "/DOUTFILE=$fixture" scripts/test-windows-update.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process -FilePath $fixture -ArgumentList /S -WindowStyle Hidden -Wait -PassThru
          exit $test.ExitCode
      - name: Packaged app starts (Windows)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release/win-unpacked/Folio.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Folio exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: folio-windows
          overwrite: true
          if-no-files-found: error
          path: |
            release/Folio-Setup.exe
            release/Folio-Setup.exe.blockmap
            release/Folio-Portable.exe
            release/latest.yml

  macos:
    needs: verify
    environment: release-macos
    # The maintainer's Mac mini, registered as a self-hosted runner (see AGENTS.md): GitHub's macOS runners can
    # queue for hours. Only tag pushes reach it; pull requests never run this workflow.
    runs-on: [self-hosted, macOS, ARM64, folio-release]
    steps:
      - *checkout
      - *setup-node
      - *install
      - *build
      - name: Package macOS
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=()
          if [ -n "$MAC_CERTIFICATE_P12_BASE64" ]; then
            echo "Signing with the Developer ID certificate and notarizing"
            export CSC_LINK="$MAC_CERTIFICATE_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD" CSC_IDENTITY_AUTO_DISCOVERY=true
            # Signed builds install their own updates (Squirrel.Mac requires a Developer ID signature).
            extra+=(-c.mac.identity="Developer ID Application" -c.mac.hardenedRuntime=true -c.mac.notarize=true -c.extraMetadata.folioMacSigned=true)
          fi
          npx electron-builder --mac "${extra[@]}" --publish never
      - name: Packaged app starts (macOS)
        run: |
          codesign --verify --deep --verbose=2 release/mac-universal/Folio.app
          # Hidden and with its own settings folder, so on the runner's Mac it shows no window, takes no focus, and
          # neither touches nor is blocked by the Folio installed there.
          release/mac-universal/Folio.app/Contents/MacOS/Folio --folio-startup-check \
            --user-data-dir="$RUNNER_TEMP/folio-startup-check" > app.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid"; then cat app.log; exit 1; fi
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          name: folio-macos
          overwrite: true
          if-no-files-found: error
          path: |
            release/Folio-mac.dmg
            release/Folio-mac.dmg.blockmap
            release/Folio-mac.zip
            release/Folio-mac.zip.blockmap
            release/latest-mac.yml
